<meta name="theme-color" content="#111111">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,700&display=swap" rel="stylesheet">
<style>
:root{
  --viola:#111111; --viola-2:#000000; --viola-chiaro:#fff0e3;
  --ciano:#fcd5b4; --ciano-bordo:#fb8a3c; --ciano-scuro:#e0701f; /* intestazioni e filtri arancioni */
  --blu:#5b4ff2; --grigio-cella:#e3e3e3; --grigio-scuro:#5f6064; --verde-acceso:#5df25d;
  --testo:#111111; --tenue:#6b6b6b; --bordo:#dcdcdc; --sfondo:#ffffff; --carta:#ffffff;
  --verde:#1e9e4a; --verde-chiaro:#e2f6e8; --ambra:#a86400; --ambra-chiaro:#fff2dc; --rosso:#e53935; --rosso-chiaro:#fde8e8;
  --grigio-chiaro:#f2f2f2; --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--sfondo);color:var(--testo);font:14px/1.45 "Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea,option{font:inherit;color:inherit;font-family:"Montserrat",system-ui,sans-serif}
a{color:var(--blu)}
.nascosto{display:none!important}

/* header */
header{position:sticky;top:0;z-index:20;background:#fff;color:var(--testo);border-bottom:1px solid var(--bordo);box-shadow:0 2px 8px rgba(0,0,0,.04)}
.barra{display:flex;align-items:center;gap:16px;padding:10px 12px}
.marchio-app{display:flex;align-items:center;gap:12px;min-width:0}
.logo-img{max-height:52px;max-width:330px;display:block}
.marchio-app small{color:var(--tenue);font-size:12px;font-weight:500;white-space:nowrap}
.data-oggi{flex:1;text-align:center;font-weight:500;font-size:24px;letter-spacing:.05em;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
@media (max-width:1100px){.data-oggi{font-size:17px}}
.spazio{flex:1}
.chip{background:var(--grigio-chiaro);border:1px solid var(--bordo);border-radius:999px;padding:4px 10px;font-size:13px;white-space:nowrap}
.btn-header{background:#fff;border:1px solid var(--bordo);color:var(--testo);border-radius:8px;padding:5px 10px;cursor:pointer}
.btn-header:hover{border-color:var(--testo)}
/* linguette arancioni (come Data Analytics); Database, Profili e Importa grigio scuro */
nav{display:flex;gap:5px;padding:8px 8px 0;overflow-x:auto;align-items:flex-end}
nav button{border:1.5px solid;border-bottom:0;border-radius:10px 10px 0 0;padding:7px 16px 7px;cursor:pointer;white-space:nowrap;font-weight:600;color:#1f1f1f;transition:padding .12s,filter .12s}
nav button:hover{filter:brightness(.95)}
nav button.t-arancio{background:#fcd5b4;border-color:#fb8a3c}
nav button.t-grigio{background:#555;border-color:#3a3a3a;color:#fff}
nav button.att{padding-top:11px;font-weight:700;box-shadow:0 -3px 8px rgba(0,0,0,.1)}
nav button.t-arancio.att{background:#fb8a3c;color:#fff}
nav button.t-grigio.att{background:#1f1f1f;border-color:#1f1f1f}
nav .conta{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--rosso);color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center}

main{max-width:none;margin:0;padding:10px 6px}
.card{background:var(--carta);border:1px solid var(--bordo);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card h2{margin:0 0 12px;font-size:16px}
.card h3{margin:0 0 10px;font-size:14px}
.sub{color:var(--tenue);font-size:13px}
.riga-flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.griglia{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px 14px}
label.campo{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--tenue);font-weight:600}
label.campo.largo{grid-column:span 2}
input,select,textarea{border:1px solid var(--bordo);background:#fff;border-radius:8px;padding:7px 9px;min-width:0;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(251,138,60,.3);border-color:var(--ciano-scuro)}
input[readonly]{background:var(--grigio-chiaro);color:var(--tenue)}
input.errato{border-color:var(--rosso);background:var(--rosso-chiaro)}
.obbl{color:#e00000;font-style:normal;font-weight:700;margin-left:2px} /* campo obbligatorio */
#r-tab tr.riga-nuova td.c-obbl{position:relative}
#r-tab tr.riga-nuova td.c-obbl::after{content:'*';position:absolute;top:50%;transform:translateY(-30%);left:11px;color:#e00000;font-weight:700;font-size:15px;line-height:1;pointer-events:none;font-style:normal} /* * rosso dentro la casella */
#r-tab tr.riga-nuova td.c-obbl input,#r-tab tr.riga-nuova td.c-obbl select{padding-left:16px}
.btn{border:1px solid var(--bordo);background:#fff;border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--viola);color:var(--viola)}
.btn.prim{background:var(--viola);border-color:var(--viola);color:#fff}
.btn.prim:hover{background:var(--viola-2);color:#fff}
.btn.peric{color:var(--rosso)}
.btn.peric:hover{border-color:var(--rosso)}
.btn.picc{padding:3px 8px;font-size:12px;font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
.icona{border:0;background:transparent;cursor:pointer;padding:3px 5px;border-radius:6px;color:var(--tenue)}
.icona:hover{background:var(--grigio-chiaro);color:var(--testo)}

/* tabelle */
.tabwrap{overflow:auto;border:1px solid var(--bordo);border-radius:var(--r);background:#fff;position:relative}
/* griglie «come Excel»: celle scelte, quadratino da trascinare, anteprima del riempimento */
td.xsel [data-f]{outline:2px solid #1a73e8;outline-offset:-1px;box-shadow:inset 0 0 0 999px rgba(26,115,232,.10)}
td.xfill [data-f]{outline:2px dashed #1a73e8;outline-offset:-1px}
#an-tab td.xsel{box-shadow:inset 0 0 0 2px #1a73e8;background-image:linear-gradient(rgba(26,115,232,.10),rgba(26,115,232,.10))}
#an-tab td.xfill{box-shadow:inset 0 0 0 2px #1a73e8;outline:1px dashed #1a73e8;outline-offset:-3px}
#an-tab td[data-ed]{cursor:cell}
tr.st-nonusa td{background:#fff3b0!important} /* Schede tempi: voce non abbinata (avviso) */
tr.st-nonusa select{background:#ffe066;border-color:#e0a200;font-weight:600}
td.xsel-ro{box-shadow:inset 0 0 0 2px #1a73e8!important;background-image:linear-gradient(rgba(26,115,232,.12),rgba(26,115,232,.12))!important}
#xsomma{position:fixed;right:18px;bottom:18px;z-index:80;background:#111;color:#fff;border-radius:999px;padding:8px 16px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.3);display:flex;gap:8px;align-items:baseline;pointer-events:none}
#xsomma b{font-size:14px}
#xsomma span{opacity:.4}
#xsomma small{opacity:.7}
.maniglia{position:absolute;width:9px;height:9px;background:#1a73e8;border:2px solid #fff;border-radius:2px;box-shadow:0 0 0 1px #1a73e8;cursor:crosshair;z-index:6}
table{border-collapse:collapse;width:100%}
th,td{padding:6px 8px;border-bottom:1px dotted #c9c9c9;text-align:center;vertical-align:middle;white-space:nowrap;font-family:"Montserrat",system-ui,sans-serif}
th{position:sticky;top:0;background:var(--ciano);font-size:13px;color:var(--testo);font-weight:500;font-style:italic;z-index:1;border-bottom:2px solid var(--ciano-bordo)}
td.n,th.n{text-align:center}
td input,td select,td textarea{text-align:center;text-align-last:center}
td.wrap{white-space:normal;min-width:160px}
tbody tr:hover{background:#fff8f2}
tfoot td{font-weight:700;background:var(--ciano);position:sticky;bottom:0}
.tab-alta{max-height:calc(100vh - 250px)}
.vuoto{padding:30px;text-align:center;color:var(--tenue)}

.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.b-da{background:var(--ambra-chiaro);color:var(--ambra)}
.b-corso{background:#ecebff;color:var(--blu)}

/* tabella come il foglio Google (stessi colori e formattazioni condizionali) */

/* foglio: tutti i valori e le intestazioni centrati (le frecce di ordinamento non spostano il titolo) */
table.foglio:not(.tab-ce) th,table.foglio:not(.tab-ce) td{text-align:center}

<div id="app"></div>
<div id="toast"></div>

<script>
/* ===================================================================
   CONFIGURAZIONE: indirizzo del Worker (es. https://richieste-lv-api.NOME.workers.dev)
   Se resta vuoto, l'app lo chiede alla prima apertura.
   =================================================================== */
const API_URL = 'https://richieste-lv-api.devid-billi.workers.dev';


/* ---------- utilità ---------- */
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// numeri all'italiana con il punto delle migliaia sempre, anche a 4 cifre (1.764): il formato it-IT lo omette sotto 10.000,
// de-DE usa gli stessi separatori (punto migliaia, virgola decimali) e raggruppa sempre
const LOCALE_NUM = 'de-DE';
const nf = {};
const fmt = (n, d = 2) => (n === null || n === undefined || n === '' || isNaN(n)) ? '' :
  (nf[d] || (nf[d] = new Intl.NumberFormat(LOCALE_NUM, { minimumFractionDigits: d, maximumFractionDigits: d }))).format(Number(n));
const fmtCns = n => (n === null || n === undefined || n === '' || isNaN(n)) ? '' : (nf.c || (nf.c = new Intl.NumberFormat(LOCALE_NUM, { maximumFractionDigits: 10 }))).format(Number(n)); // CNS: tutti i decimali
const fmtN = n => (n === null || n === undefined || n === '' || isNaN(n)) ? '' : (nf.n || (nf.n = new Intl.NumberFormat(LOCALE_NUM, { maximumFractionDigits: 2 }))).format(Number(n));
const dIt = s => s ? `${s.slice(8, 10)}/${s.slice(5, 7)}/${s.slice(0, 4)}` : '';
const dCorta = s => s ? `${s.slice(8, 10)}/${s.slice(5, 7)}/${s.slice(2, 4)}` : '';
const isoLocale = d => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const oggi = () => isoLocale(new Date());
const giorniFa = n => isoLocale(new Date(Date.now() - n * 864e5));
const settimana = s => { // WEEKNUM di Google Sheets (settimana da domenica)
  if (!s) return '';
  const d = new Date(s + 'T00:00:00'); const g1 = new Date(d.getFullYear(), 0, 1);
  const doy = Math.round((d - g1) / 864e5) + 1;
  return Math.floor((doy + g1.getDay() - 1) / 7) + 1;
};
const API = () => (API_URL || store.get('rlv_api') || '').replace(/\/+$/, '');

function toast(msg, tipo = '') {
  const el = document.createElement('div');
  el.className = 'toast ' + tipo; el.textContent = msg;
  $('#toast').appendChild(el);
  setTimeout(() => el.remove(), tipo === 'err' ? 7000 : 3200);
}
async function api(path, { method = 'GET', body, query, tentativo = 0 } = {}) {
  let url = API() + path;
  if (query) {
    const p = new URLSearchParams();
    Object.entries(query).forEach(([k, v]) => { if (v !== undefined && v !== null && v !== '') p.set(k, v); });
    const s = p.toString(); if (s) url += '?' + s;
  }
  let res;
  try {
    res = await fetch(url, { method, headers: { 'Content-Type': 'application/json', ...(S.token ? { Authorization: 'Bearer ' + S.token } : {}) }, body: body ? JSON.stringify(body) : undefined });
  } catch (e) { throw new Error('Server non raggiungibile. Controlla la connessione.'); }
  let data;
  try { data = await res.json(); } catch (e) { data = { errore: 'Risposta non valida dal server (' + res.status + ')' }; }
  if (res.status === 401 && S.token && path !== '/api/login') { esci(true); throw new Error(data.errore || 'Sessione scaduta'); }
  if (!res.ok) {
    let msg = data.errore || 'Errore ' + res.status;
    const pieno = /overloaded|too many resources/i.test(msg); // D1 momentaneamente sovraccarico
    if (pieno && method === 'GET' && tentativo < 2) { await new Promise(r => setTimeout(r, 2500 * (tentativo + 1))); return api(path, { method, body, query, tentativo: tentativo + 1 }); }
    if (pieno) msg = 'Database momentaneamente sovraccarico: riprova tra qualche secondo';
    const e = new Error(msg); e.status = res.status; throw e;
  }
  return data;
}
function modale(titolo, corpo, piede = '', largo = false) {
  chiudiModale();
  const v = document.createElement('div');
  v.className = 'velo'; v.id = 'velo';
  v.innerHTML = `<div class="modale ${largo ? 'largo' : ''}" role="dialog"><div class="modale-testa"><h3>${titolo}</h3><button class="icona" onclick="chiudiModale()" aria-label="Chiudi">✕</button></div>
    <div class="modale-corpo">${corpo}</div>${piede ? `<div class="modale-piede">${piede}</div>` : ''}</div>`;
  v.addEventListener('mousedown', e => { if (e.target === v) chiudiModale(); });
  document.body.appendChild(v);
  const f = v.querySelector('input:not([readonly]),select,textarea'); if (f) setTimeout(() => f.focus(), 30);
  return v;
}
function chiudiModale() { const v = $('#velo'); if (v) v.remove(); if (S.novita) setTimeout(aggiornaDaAltri, 300); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('#velo')) chiudiModale(); else if ($('#pannello')) chiudiForm(); chiudiPop(); } });
function occhio(id) { return `<button type="button" onclick="const i=document.getElementById('${id}');i.type=i.type==='password'?'text':'password';this.textContent=i.type==='password'?'👁':'🙈'" aria-label="Mostra o nascondi">👁</button>`; }
function badgeStato(s) {
  const c = { 'Da elaborare': 'b-da', 'In corso': 'b-corso', 'Chiusa': 'b-chiusa', 'Non richiedere': 'b-no', 'Senza avanzamento': 'b-senza' }[s] || 'b-no';
  return `<span class="badge ${c}">${esc(s || '')}</span>`;
}
const minTot = r => ['min_taglio', 'min_prep', 'min_ting', 'min_rma'].reduce((a, k) => a + (Number(r[k]) || 0), 0);

/* ---------- stato applicazione ---------- */
const S = {
  token: store.get('rlv_token'), profilo: null, ana: null, vista: null,
  prossimo: '', filtri: {}, cache: {}, nuove: [], nuoveScheda: '',
};
const isMag = () => S.profilo && (S.profilo.ruolo === 'magazzino' || S.profilo.ruolo === 'admin');
const isAdmin = () => S.profilo && S.profilo.ruolo === 'admin';

function prepAnagrafiche(a) {
  S.ana = a;
  S.prossimo = a.prossimo_numero;
  S.mot = new Map(a.motivazioni.map(m => [m[0], { resp: m[1], macro: m[2] }]));
  S.art = new Map(a.articoli.map(x => [x[0], x[1]]));
  S.opSet = new Set(a.operatori);
  S.compPerPf = new Map(); S.compSet = new Set();
  for (const c of a.componenti) {
    if (S.compSet.has(c[0])) continue;
    S.compSet.add(c[0]);
    if (!S.compPerPf.has(c[1])) S.compPerPf.set(c[1], []);
    S.compPerPf.get(c[1]).push({ chiave: c[0], pf: c[1], nome: c[2], tipo: c[3], tm: c[4], npz: c[5], sec: c[6], padre: c[7] || null });
  }
  for (const [pf, lista] of S.compPerPf) { // ogni rinforzo subito sotto il suo componente principale
    const chiavi = new Set(lista.map(c => c.chiave));
    lista.forEach(c => { if (c.padre && !chiavi.has(c.padre)) c.padre = null; });
    const figli = new Map(); lista.filter(c => c.padre).forEach(c => { if (!figli.has(c.padre)) figli.set(c.padre, []); figli.get(c.padre).push(c); });
    lista.forEach(c => { c.nRinf = (figli.get(c.chiave) || []).length; });
    S.compPerPf.set(pf, lista.filter(c => !c.padre).flatMap(c => [c, ...(figli.get(c.chiave) || [])]));
  }
  $('#dl-operatori').innerHTML = a.operatori.map(o => `<option value="${esc(o)}">`).join('');
  $('#dl-motivazioni').innerHTML = a.motivazioni.map(m => `<option value="${esc(m[0])}">${esc(m[1] || '')}</option>`).join('');
  $('#dl-articoli').innerHTML = [...S.compPerPf.keys()].map(pf => `<option value="${esc(pf + ' — ' + (S.art.get(pf) || ''))}">`).join('');
  $('#dl-componenti').innerHTML = [...S.compSet].map(k => `<option value="${esc(k)}">`).join('');
}
async function caricaAnagrafiche() { prepAnagrafiche(await api('/api/anagrafiche')); }

S.logo = store.get('rlv_logo') || null;
async function caricaLogo() {
  try {
    const r = await api('/api/logo');
    if ((r.logo || null) === S.logo) return;
    S.logo = r.logo || null;
    if (S.logo) store.set('rlv_logo', S.logo); else store.del('rlv_logo');
    aggiornaIntestazioni();
  } catch (e) {}
}
// intestazione: linea nera da bordo a bordo, DiMar ai lati e il logo caricato al centro; sotto la data
function intestazioneHtml(id = '', conModifica = true) {
  const centro = S.logo ? `<span class="logo-centro"><img src="${S.logo}" alt="Logo" class="logo-caricato">${conModifica && isAdmin() ? `<label class="cambia-logo no-print" title="Sostituisci il logo">Cambia logo<input type="file" accept="image/*" onchange="caricaImmagineLogo(this.files[0])"></label>` : ''}</span>`
    : (conModifica && isAdmin() ? `<label class="carica-logo">Carica il logo<small>si carica una volta sola</small><input type="file" accept="image/*" onchange="caricaImmagineLogo(this.files[0])"></label>` : '');
  const dimar = `<img src="${LOGO_DIMAR}" alt="DiMar Group" class="testata-img">`;
  return `<div class="intestazione"${id ? ` id="${id}"` : ''}><span class="seg corto"></span>${dimar}<span class="seg"></span>${centro ? centro + '<span class="seg"></span>' : ''}${dimar}<span class="seg corto"></span></div>`;
}
function testataFoglio() {
  return `<div class="testata" id="testata">${intestazioneHtml()}<div class="testata-data">${dataLunga()}</div></div>`;
}
function aggiornaIntestazioni() {
  if ($('#testata')) $('#testata').outerHTML = testataFoglio();
  if ($('#mo-int')) $('#mo-int').outerHTML = intestazioneHtml('mo-int', false);
}
function caricaImmagineLogo(file) {
  if (!file || !isAdmin()) return; // loghi e sfondi li cambia solo l'amministratore
  if (!/^image\//.test(file.type)) return toast('Scegli un file immagine', 'err');
  const url = URL.createObjectURL(file), img = new Image();
  img.onload = () => { // ridimensionato (max 1200×240) per tenerlo leggero
    const k = Math.min(1, 1200 / img.width, 240 / img.height), c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    salvaLogo(rifila(c).toDataURL('image/png'));
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast('Immagine non leggibile', 'err'); };
  img.src = url;
}
// toglie i margini vuoti (trasparenti o bianchi) così il logo si appoggia bene sulla linea
function rifila(c) {
  const { width: w, height: h } = c, d = c.getContext('2d').getImageData(0, 0, w, h).data;
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = (y * w + x) * 4;
    if (d[i + 3] > 20 && !(d[i] > 245 && d[i + 1] > 245 && d[i + 2] > 245)) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  }
  if (x1 < 0 || (x0 === 0 && y0 === 0 && x1 === w - 1 && y1 === h - 1)) return c;
  const o = document.createElement('canvas'); o.width = x1 - x0 + 1; o.height = y1 - y0 + 1;
  o.getContext('2d').drawImage(c, x0, y0, o.width, o.height, 0, 0, o.width, o.height);
  return o;
}
async function salvaLogo(dataUrl) {
  try {
    await api('/api/admin/logo', { method: 'PUT', body: { logo: dataUrl } });
    S.logo = dataUrl; store.set('rlv_logo', dataUrl);
    aggiornaIntestazioni();
    toast('Logo salvato', 'ok');
  } catch (e) { toast(e.message, 'err'); }
}
function dataLunga() { return new Date().toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).toUpperCase(); }
async function avvia() {
  if (!API()) return schermataConfig();
  caricaLogo();
  if (S.token) {
    try {
      const me = await api('/api/me');
      S.profilo = me.profilo;
      await caricaAnagrafiche();
      return mostraApp();
    } catch (e) { S.token = null; store.del('rlv_token'); }
  }
  schermataLogin();
}
function schermataConfig() {
  $('#app').innerHTML = `<div class="login"><div class="login-loghi"><img src="${LOGO_DIMAR}" alt="DiMar Group" class="login-dimar"></div><h1>LV_Richieste</h1>
    <p class="sub">Indica l'indirizzo del Worker Cloudflare (lo trovi nel dashboard: Workers → richieste-lv-api).</p>
    <label class="campo">Indirizzo API<input id="cfg-url" placeholder="https://richieste-lv-api.nome.workers.dev"></label>
    <div style="margin-top:14px"><button class="btn prim" onclick="salvaConfig()">Continua</button></div></div>`;
}
function salvaConfig() {
  const u = $('#cfg-url').value.trim();
  if (!/^https?:\/\//.test(u)) return toast('Indirizzo non valido', 'err');
  store.set('rlv_api', u); avvia();
}
async function schermataLogin() {
  const logoLogin = () => S.logo ? `<img src="${S.logo}" alt="Logo">` : '';
  $('#app').innerHTML = `<div class="login"><div class="login-loghi"><img src="${LOGO_DIMAR}" alt="DiMar Group" class="login-dimar"><span class="login-logo" id="login-logo">${logoLogin()}</span></div><h1>LV_Richieste</h1>
    <form id="f-login" onsubmit="event.preventDefault();entra()">
      <label class="campo">Profilo<select id="l-nome"><option value="">Caricamento…</option></select></label>
      <label class="campo" style="margin-top:10px">Password<div class="pw"><input id="l-pw" type="password" autocomplete="current-password">${occhio('l-pw')}</div></label>
      <button class="btn prim" style="width:100%;margin-top:16px">Entra</button>
    </form>
    ${API_URL ? '' : `<p class="sub" style="margin-top:14px">Server: ${esc(API())} · <a href="#" onclick="store.del('rlv_api');avvia();return false">cambia</a></p>`}</div>`;
  try {
    const { profili } = await api('/api/profili');
    const ultimo = store.get('rlv_ultimo');
    $('#l-nome').innerHTML = '<option value="">Scegli…</option>' + profili.map(p => `<option ${p.nome === ultimo ? 'selected' : ''}>${esc(p.nome)}</option>`).join('');
    if (ultimo) $('#l-pw').focus();
  } catch (e) { $('#l-nome').innerHTML = '<option value="">Server non raggiungibile</option>'; toast(e.message, 'err'); }
  await caricaLogo();
  const ll = $('#login-logo'); if (ll) ll.innerHTML = logoLogin();
}
async function entra() {
  const nome = $('#l-nome').value, password = $('#l-pw').value;
  if (!nome) return toast('Scegli il profilo', 'err');
  try {
    const r = await api('/api/login', { method: 'POST', body: { nome, password } });
    S.token = r.token; S.profilo = r.profilo;
    store.set('rlv_token', r.token); store.set('rlv_ultimo', nome);
    await caricaAnagrafiche();
    mostraApp();
  } catch (e) { toast(e.message, 'err'); }
}
function esci(scaduta) {
  S.token = null; S.profilo = null; store.del('rlv_token');
  chiudiModale(); schermataLogin();
  if (scaduta === true) toast('Sessione scaduta: accedi di nuovo', 'err');
}

// Preparazione DG, Tingitura e RMA: riepilogo dei Pz KO con la loro responsabilità da tutti i fogli
const RESPONSABILITA = ['Preparazione', 'Tingitura', 'RMA'];
const NOMI_RUOLI = { scheda: 'Linea (solo il suo foglio)', magazzino: 'Collaboratore', admin: 'Amministratore' };
function respProfilo() { return S.profilo && S.profilo.ruolo === 'scheda' ? ({ preparazione: 'Preparazione', tingitura: 'Tingitura', rma: 'RMA' })[S.profilo.chiusura] || '' : ''; }
function voci() {
  const r = S.profilo.ruolo;
  const v = [];
  // admin: tutto · magazzino: Da elaborare, Avanzamento, Modulo · linea: solo il proprio foglio (col suo nome)
  if (r !== 'magazzino') v.push(['foglio', r === 'scheda' ? S.profilo.nome : 'Inserimento Dati']);
  if (r !== 'scheda') { v.push(['elabora', 'Da elaborare']); v.push(['avanzamento', 'Avanzamento']); v.push(['modulo', 'Modulo']); }
  if (r === 'admin' || respProfilo()) v.push(['responsabilita', r === 'scheda' ? 'Riepilogo ' + respProfilo() : 'Responsabilità']); // il magazzino non la vede
  if (r === 'admin') { v.push(['analytics', 'Data Analytics']); v.push(['anagrafiche', 'Database']); v.push(['profili', 'Profili']); v.push(['import', 'Importa']); }
  return v;
}
/* ===================== AGGIORNAMENTO QUASI IN TEMPO REALE =====================
   Ogni 15 secondi (solo con la pagina in primo piano) chiede al Worker se qualcuno ha cambiato qualcosa; se sì ricarica la sezione aperta
   tenendo la posizione nelle tabelle. Se l'utente sta lavorando (scrive in una casella, ha una finestra, un modulo o righe nuove aperte,
   ha tolto delle spunte in Da elaborare) l'aggiornamento aspetta che abbia finito. */
const SECONDI_NOVITA = 15;
const RICARICA_VISTA = {
  foglio: () => cercaRighe(),
  elabora: () => caricaElabora(),
  avanzamento: () => caricaAvanzamento(),
  modulo: () => { if (!S.cache.modulo) return; S.cache.modulo = null; return caricaModulo(); },
  responsabilita: () => caricaResponsabilita(),
  analytics: () => caricaAnalytics(),

function rendiMobile(btn, azione = aggiungiNuova) {
  let start = null, spostato = false, pos = null;
  const metti = (x, y) => {
    x = Math.min(Math.max(8, x), innerWidth - btn.offsetWidth - 8); y = Math.min(Math.max(8, y), innerHeight - btn.offsetHeight - 8);
    Object.assign(btn.style, { left: x + 'px', top: y + 'px', right: 'auto', bottom: 'auto' }); pos = { x, y };
  };
  try { const p = JSON.parse(store.get('rlv_fab') || 'null'); if (p) metti(p.x, p.y); } catch (e) {}
  btn.addEventListener('pointerdown', e => { const r = btn.getBoundingClientRect(); start = { px: e.clientX, py: e.clientY, x: r.left, y: r.top }; spostato = false; btn.setPointerCapture(e.pointerId); });
  btn.addEventListener('pointermove', e => {
    if (!start) return;
    const dx = e.clientX - start.px, dy = e.clientY - start.py;
    if (!spostato && Math.hypot(dx, dy) < 6) return;
    spostato = true; btn.classList.add('trascina'); metti(start.x + dx, start.y + dy);
  });
  const fine = () => {
    if (start && spostato && pos) store.set('rlv_fab', JSON.stringify(pos));
    btn.classList.remove('trascina'); start = null;
  };
  btn.addEventListener('pointerup', fine); btn.addEventListener('pointercancel', fine);
  btn.addEventListener('click', () => { if (spostato) { spostato = false; return; } azione(); });
  btn.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); azione(); } });
  if (rendiMobile.ridim) window.removeEventListener('resize', rendiMobile.ridim);
  rendiMobile.ridim = () => { if (pos && btn.isConnected) metti(pos.x, pos.y); };
  window.addEventListener('resize', rendiMobile.ridim);
}

function leggiForm() {
  return { data: $('#e-data').value, bollettino: $('#e-boll').value.trim(), conceria: $('#e-conc').value, team_leader: $('#e-tl').value.trim(),
    componente: $('#e-comp').value, pz_ko: $('#e-pz').value, motivazione: $('#e-mot').value.trim(), operatore: $('#e-op').value.trim(),
    materiale: $('#e-mat').value, stato_elab: $('#e-stato').value, note: $('#e-note').value.trim() };
}
function validaForm(b) {
  const err = [];
  const segna = id => $(id).classList.add('errato');
  $$((S.form ? S.form.cont : '#velo') + ' .errato').forEach(x => x.classList.remove('errato'));
  if (!b.data) { err.push('data'); segna('#e-data'); }
  if (!S.compSet.has(b.componente) && !(b.componente && $('#e-comp option:checked') && /non in anagrafica/.test($('#e-comp option:checked').textContent))) { err.push('componente'); segna(S.compPerPf.has(codiceDaArt($('#e-art').value)) ? '#e-comp' : '#e-art'); }
  if (!(Number(b.pz_ko) > 0)) { err.push('pz KO'); segna('#e-pz'); }
  if (!S.mot.has(b.motivazione)) { err.push(b.motivazione ? 'motivazione non in elenco' : 'motivazione'); segna('#e-mot'); }
  if (b.operatore && !S.opSet.has(b.operatore)) { err.push('operatore non in elenco'); segna('#e-op'); }
  if (b.team_leader && !S.opSet.has(b.team_leader)) { err.push('team leader non in elenco'); segna('#e-tl'); }
  return err;
}
async function salvaForm(id, altra) {

    if (id) {
      if ($('#e-numero')) b.numero = $('#e-numero').value.trim();

    } else {
      b.pz_ko = Number(b.pz_ko);
      await api('/api/righe', { method: 'POST', body: { scheda: S.cache.formScheda, righe: [b] } });
      S.ultimi = { data: b.data, bollettino: b.bollettino, conceria: b.conceria, team_leader: b.team_leader, sku: b.componente.split('-')[0], stato_elab: b.stato_elab };
      toast('Riga aggiunta', 'ok');

async function esportaRighe() {
  const f = S.filtri.righe;
  toast('Preparo il file…');
  try {
    let tutte = [], offset = 0, tot = 1;
    while (offset < tot) {
      const r = await api('/api/righe', { query: { dal: f.dal, al: f.al, stato: f.stato, scheda: f.scheda, q: f.q, numero: f.numero, ord: f.ord, dir: f.dir, limit: 1000, offset } });
      tutte = tutte.concat(r.righe); tot = r.totali.n; offset += r.righe.length; if (!r.righe.length) break;
    }
    const cols = [['stato_calc', 'Stato'], ['scheda', 'Scheda'], ['numero', 'N° richiesta'], ['stato_elab', 'Stato elaborazione'], ['data', 'Data'], ['bollettino', 'Bollettino'],
      ['conceria', 'Conceria'], ['team_leader', 'Team leader'], ['componente', 'Componente'], ['sku', 'SKU'], ['descrizione', 'Descrizione'], ['codice_materiale', 'Codice materiale'],
      ['pz_ko', 'Pz KO'], ['motivazione', 'Motivazione'], ['responsabilita', 'Responsabilità'], ['operatore', 'Operatore'], ['materiale', 'Materiale richiesto'], ['note', 'Note'],
      ['min_taglio', 'minuti TAGLIO'], ['min_prep', 'minuti PREPARAZIONE'], ['min_ting', 'minuti TINGITURA'], ['min_rma', 'minuti RMA'],
      ['n_pz', 'N°Pz'], ['totale_minuti', 'Totale minuti'], ['cns_area', 'CNS area'], ['prezzo', '€ materiale'], ['tdp', 'TDP'], ['altri_materiali', 'Altri materiali'],
      ['totale_eur', 'Totale €'], ['tm', 'TM'], ['macro_categoria', 'Macro categoria']];
    const cella = v => { if (v === null || v === undefined) return ''; if (typeof v === 'number') return String(v).replace('.', ','); const s = String(v); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    const csv = '﻿' + [cols.map(c => c[1]).join(';'), ...tutte.map(r => cols.map(([k]) => k === 'data' ? dIt(r.data) : cella(r[k])).join(';'))].join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    a.download = `righe_LV_${oggi()}.csv`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  } catch (e) { toast(e.message, 'err'); }
}

function disegnaAnalytics() {

  $('#da-resp').innerHTML = `<table class="da-tab"><thead><tr><th class="sx">Responsabilità</th><th class="eur">€/Borsa</th><th>Pz KO/Borse Prodotte</th><th>Pz KO</th><th class="eur">Totale Difetti ▾</th></tr></thead>

function adattaTabelleDa() {
  for (const [id, alto, min, max] of [['#da-resp', true, 13, 24], ['#da-mot', false, 15, 19], ['#da-descr', false, 15, 19]]) {
    const box = $(id), t = box && box.querySelector('table'); if (!t || !box.clientWidth) continue;
    const celle = [...t.querySelectorAll('tbody td.sx')].slice(0, 300);
    const ok = fs => {
      t.style.fontSize = fs + 'px';
      if (t.offsetWidth > box.clientWidth + 1) return false;
      if (alto) return t.offsetHeight <= box.clientHeight + 1 && !celle.some(c => c.scrollWidth > c.clientWidth + 1);
      return celle.filter(c => c.scrollWidth > c.clientWidth + 1).length <= celle.length / 10;
    };
    let lo = min, hi = max;
    if (ok(hi)) lo = hi; else while (hi - lo > 0.25) { const m = (lo + hi) / 2; if (ok(m)) lo = m; else hi = m; }
    t.style.fontSize = lo + 'px';

// i grafici si disegnano alla misura reale del riquadro: la torta e le barre lo riempiono e il testo resta sempre della stessa grandezza

// larghezza reale del testo (stesso font della pagina): le etichette si accorciano solo se davvero non ci stanno
const larghezzaTesto = (s, fs) => { const c = larghezzaTesto.c || (larghezzaTesto.c = document.createElement('canvas').getContext('2d')); c.font = `${fs}px ${getComputedStyle(document.body).fontFamily}`; return c.measureText(String(s)).width; };

  const fs = W < 400 ? 13 : 15, lh = fs + 3, cw = fs * 0.6;

  if (legenda) {

    let col, colX, colW, y0, lf = fs;
    if (aLato) { col = 1; colW = [legW]; colX = [W - legW]; r = Math.floor(Math.min((W - legW - 24) / 2, H / 2 - 6)); cx = Math.round((W - legW - 24) / 2) + 4; cy = H / 2; y0 = Math.round(H / 2 - (fette.length * rh) / 2 + fs); }
    else {
      col = W >= 300 ? 2 : 1; const legH = Math.ceil(fette.length / col) * rh + 10; r = Math.floor(Math.min(W / 2 - 8, (H - legH) / 2 - 6)); cy = r + 6; y0 = 2 * r + 22;

      const k = Math.min(1, (W - 8) / tot);

// "Sara Visintin" → "S.Visintin" (come nel report); i reparti restano interi
const nomeCorto = s => { const p = String(s || '').trim().split(/\s+/); return p.length === 2 && /^[A-Z][a-zà-ù]+$/.test(p[1]) && !/^(Preparazione|Taglio|Tingitura|Assemblaggio|Magazzino|Reparto)$/i.test(p[0]) ? p[0][0] + '.' + p[1] : s; };
function svgBarre(voci, W, H) {
  if (!voci.length) return '<p class="sub" style="text-align:center;margin-top:60px">Nessun dato</p>';
  W = Math.max(260, Math.round(W || 600)); H = Math.max(200, Math.round(H || 330));
  const n = voci.length, fs = W / n < 34 ? 11 : 14, cw = fs * 0.6, ang = 35 * Math.PI / 180;
  const nomi = voci.map(x => { const s = nomeCorto(x.nome); return s.length > 14 ? s.slice(0, 13) + '…' : s; });
  const lw = Math.max(...nomi.map(s => larghezzaTesto(s, fs))), passo0 = (W - 20) / n;
  const dritti = passo0 >= lw + 10; // c'è posto: nomi orizzontali sotto le barre
  const sotto = dritti ? fs + 14 : Math.ceil(lw * Math.sin(ang) + fs + 12);

    ${voci.map((x, i) => {
      const h = Math.max(1, (x.v / max) * (base - top)), X = sx + i * passo + (passo - bw) / 2, cxx = X + bw / 2, tip = `<b>${esc(x.nome)}</b><br>Pz KO ${fmtN(Math.round(x.v))}`;
      return `<rect x="${X.toFixed(1)}" y="${(base - h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="#fbbf93" stroke="#f08a4b" stroke-width="1.5" data-tip="${esc(tip)}"/>`

    <tbody>${righe.map((x, i) => `<tr class="${x._rinf ? 'rinf' : ''}">${COL_MODULO.map(([k]) => `<td class="${k === 'pz' ? 'rosso' : ''}${k === 'componente' ? ' sx' : ''}">${v(x, k)}</td>`).join('')}</tr>`).join('')}</tbody></table>

function caricaSfondo(file) {
  if (!file || !isAdmin()) return;
  if (!/^image\//.test(file.type)) return toast('Scegli un file immagine', 'err');
  const url = URL.createObjectURL(file), img = new Image();
  img.onload = async () => { // ridimensionato (lato lungo max 1800) e compresso per tenerlo leggero
    const k = Math.min(1, 1800 / Math.max(img.width, img.height)), c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    let dato = c.toDataURL('image/jpeg', 0.82);
    if (dato.length > 1800000) dato = c.toDataURL('image/jpeg', 0.6);
    try {
      await api('/api/admin/sfondo', { method: 'PUT', body: { sfondo: dato } });
      S.sfondo = dato; store.set('rlv_sfondo', dato); applicaSfondo();
      toast('Sfondo salvato', 'ok'); if ($('#mod-tela')) vistaModulo();
    } catch (e) { toast(e.message, 'err'); }
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast('Immagine non leggibile', 'err'); };
  img.src = url;
}

  const acc = /ACCESSORIO/i.test(c.n_materiale || '') || c.tm === 'Accessorio', m = [];
  const inf = /INFUSTITURA/i.test(c.n_materiale || '') || c.tm === 'Infustitura';
  if (vuoto(c.n_materiale) && !conRinforzi) m.push('n_materiale');

    if (vuoto(c.n_pz)) m.push('n_pz');
    if (vuoto(c.cns_area) && !conRinforzi) m.push('cns_area');
    if (vuoto(c.sec_taglio)) m.push('sec_taglio');
    if (vuoto(c.sec_prep)) m.push('sec_prep');

  if (!vuoto(c.n_materiale) && vuoto(c.codice_materiale)) m.push('codice_materiale');

    const righe = (await api('/api/admin/componenti/tutti')).righe, padri = new Set(righe.map(c => c.padre).filter(Boolean));
    // principale senza materiale e CNS solo se tra i rinforzi c'è un pezzo di materiale (Sopra/Sotto…): con sole infustiture/accessori il materiale resta suo

function caricaSheetJS() {

  return new Promise((ok, ko) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';
    s.onload = ok;
    s.onerror = () => { // riserva

      r.onload = ok; r.onerror = () => ko(new Error('Impossibile caricare la libreria per leggere i file Excel')); document.head.appendChild(r);
    };
    document.head.appendChild(s);
  });
}
// --- conversioni ---
const vNum = v => {
  if (v === null || v === undefined || v === '') return null;
  if (typeof v === 'number') return Number.isFinite(v) ? v : null;
  if (typeof v === 'boolean') return v ? 1 : 0;
  const s = String(v).trim(); if (!s || s.startsWith('#')) return null;
  const n = Number(s.includes(',') ? s.replace(/\./g, '').replace(',', '.') : s);
  return Number.isFinite(n) ? n : null;
};
const vTxt = v => { if (v === null || v === undefined) return null; if (typeof v === 'number') return Number.isInteger(v) ? String(v) : String(v); const s = String(v).trim(); return s === '' || /^#(REF|N\/A|VALUE|DIV\/0|NAME|NUM|ERROR)/i.test(s) ? null : s; };
const vData = v => {
  if (v === null || v === undefined || v === '') return null;
  if (v instanceof Date) return isNaN(v) ? null : isoLocale(v);
  if (typeof v === 'number') { if (v < 20000 || v > 80000) return null; const d = new Date(Math.round((v - 25569) * 864e5)); return d.toISOString().slice(0, 10); }
  const s = String(v).trim(); let m;
  if ((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/))) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
  if ((m = s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return `${m[1]}-${m[2]}-${m[3]}`;
  return null;
};
const vBool = v => v === true || v === 1 || String(v).toUpperCase() === 'TRUE' || String(v).toUpperCase() === 'VERO' ? 1 : 0;
const col = L => { let n = 0; for (const ch of L) n = n * 26 + ch.charCodeAt(0) - 64; return n - 1; };
function righeFoglio(wb, nome) { const ws = wb.Sheets[nome]; if (!ws) return null; return XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null, blankrows: true }); }
function unici(arr) { const s = new Set(), out = []; for (const x of arr) { if (x && !s.has(x)) { s.add(x); out.push(x); } } return out; }

async function analizzaImport() {
  const fR = $('#im-ric').files[0], fE = $('#im-ela').files[0];

  const b = $('#im-an'); b.disabled = true; b.textContent = 'Lettura in corso…';
  try {
    await caricaSheetJS();
    const T = {};
    const avvisi = [];
    if (fR) {
      const wb = XLSX.read(await fR.arrayBuffer(), { type: 'array', cellDates: false, cellFormula: false, cellHTML: false, cellStyles: false });
      const db = righeFoglio(wb, 'Database');
      if (!db) throw new Error('Nel file delle richieste manca il foglio "Database"');
      const d = db.slice(1);
      T.operatori = unici(d.map(r => vTxt(r[col('A')]))).map(nome => ({ nome }));
      T.concerie = unici(d.map(r => vTxt(r[col('B')]))).map(nome => ({ nome }));
      T.materiali = unici(d.map(r => vTxt(r[col('G')]))).map(nome => ({ nome }));
      T.motivazioni = d.filter(r => vTxt(r[col('E')])).map(r => ({ motivazione: vTxt(r[col('E')]), responsabilita: vTxt(r[col('F')]), macro_categoria: vTxt(r[col('D')]) }));
      T.articoli = d.filter(r => vTxt(r[col('I')]) && vTxt(r[col('H')])).map(r => ({ codice: vTxt(r[col('I')]), descrizione: vTxt(r[col('H')]), ubicazione: vTxt(r[col('J')]) }));
      T.componenti = d.filter(r => vTxt(r[col('M')]) && vTxt(r[col('Q')])).map(r => ({

        n_pz: vNum(r[col('U')]), cns_area: vNum(r[col('R')]), sec_taglio: vNum(r[col('W')]), sec_prep: vNum(r[col('X')]), sec_ting: vNum(r[col('Y')]), sec_rma: vNum(r[col('Z')]),
        codice_materiale: vTxt(r[col('O')]), descr_materiale: vTxt(r[col('P')]), um: vTxt(r[col('AA')]), prezzo: vNum(r[col('V')]), tdp: vNum(r[col('AC')]), tm: vTxt(r[col('AD')]) }));

          descr_materiale: vTxt(r[col('E')]), um: vTxt(r[col('F')]), consumo: vNum(r[col('G')]), tipologia: vTxt(r[col('H')]), prezzo_budget: vNum(r[col('I')]), note: vTxt(r[col('J')]) }));

        prezzo: vNum(r[col('D')]), um: vTxt(r[col('E')]), tipo_categoria: vTxt(r[col('F')]), categoria: vTxt(r[col('G')]), brand_categoria: vTxt(r[col('H')]), collezione: vTxt(r[col('I')]) }));

      const av = righeFoglio(wb, 'Avanzamento Richieste');
      if (!av) throw new Error('Nel file di elaborazione manca il foglio "Avanzamento Richieste"');
      T.richieste = mappaAvanzamento(av);
    }
    S.cache.imp = T;
    const nomi = { operatori: 'Operatori', concerie: 'Concerie', materiali: 'Materiali', motivazioni: 'Motivazioni', articoli: 'Articoli', componenti: 'Componenti',
      distinta: 'Distinta LV', tdp: 'TDP', items_bc: 'Items BC', righe: 'Righe richiesta', richieste: 'Avanzamento richieste' };

      <tbody>${Object.keys(T).map(k => `<tr><td><input type="checkbox" class="im-sel" value="${k}" checked></td><td>${nomi[k] || k}</td><td class="n">${fmtN(T[k].length)}</td></tr>`).join('')}</tbody></table></div>
      ${avvisi.length ? `<p class="sub">⚠ ${avvisi.map(esc).join('<br>⚠ ')}</p>` : ''}
      <div class="riga-flex" style="margin-top:12px"><button class="btn prim" id="im-go" onclick="eseguiImport()">Importa le tabelle selezionate</button></div>
      <div class="progress" style="margin-top:12px"><div id="im-bar"></div></div><div class="log" id="im-log" style="margin-top:10px;display:none"></div></div>`;
  } catch (e) { toast(e.message, 'err'); }
  finally { b.disabled = false; b.textContent = 'Analizza i file'; }
}

    e_taglio: vData(r[col('F')]), f_taglio: vBool(r[col('G')]), e_prep: vData(r[col('H')]), f_prep: vBool(r[col('I')]), e_ting: vData(r[col('J')]), f_ting: vBool(r[col('K')]),
    e_rma: vData(r[col('L')]), f_rma: vBool(r[col('M')]), e_assemblaggio: vData(r[col('N')]), stato: vTxt(r[col('O')]) === 'Chiusa' ? 'Chiusa' : null, note: vTxt(r[col('P')]),
    creato_il: new Date().toISOString(), modificato_il: new Date().toISOString() }));
}
async function eseguiImport() {
  const sel = $$('.im-sel').filter(c => c.checked).map(c => c.value);
  if (!sel.length) return toast('Seleziona almeno una tabella', 'err');
  let avviso = '';
  try { const c = await api('/api/admin/conteggi'); if (c.righe_app && sel.includes('righe')) avviso = `\n\nATTENZIONE: nel database ci sono ${fmtN(c.righe_app)} righe inserite dall'app. Reimportando le righe verranno CANCELLATE.`;
    if (c.richieste && sel.includes('richieste')) avviso += `\n\nL'avanzamento attuale (${fmtN(c.richieste)} richieste) verrà sostituito da quello del file.`; } catch (e) {}
  if (!confirm(`Le tabelle selezionate (${sel.length}) verranno svuotate e ricaricate dai file. Continuare?${avviso}`)) return;
  if (avviso.includes('CANCELLATE') && prompt('Per confermare scrivi CANCELLA') !== 'CANCELLA') return toast('Importazione annullata');
  const T = S.cache.imp, log = $('#im-log'); log.style.display = 'block'; log.textContent = '';
  const scrivi = s => { log.textContent += s + '\n'; log.scrollTop = log.scrollHeight; };
  const tot = sel.reduce((a, k) => a + Math.max(1, T[k].length), 0); let fatti = 0;
  const go = $('#im-go'); go.disabled = true;
  try {
    for (const k of sel) {
      const righe = T[k], BLOCCO = k === 'righe' ? 350 : 500;
      scrivi(`${k}: ${fmtN(righe.length)} record…`);
      if (!righe.length) { await api('/api/admin/import/' + k, { method: 'POST', body: { righe: [], svuota: true } }); fatti++; continue; }
      for (let i = 0; i < righe.length; i += BLOCCO) {
        const blocco = righe.slice(i, i + BLOCCO);
        let tent = 0;
        while (true) {
          try { await api('/api/admin/import/' + k, { method: 'POST', body: { righe: blocco, svuota: i === 0 } }); break; }
          catch (e) { if (++tent >= 3) throw e; scrivi(`  nuovo tentativo (${e.message})`); await new Promise(r => setTimeout(r, 3000 * tent)); }
        }
        fatti += blocco.length;
        $('#im-bar').style.width = Math.round(fatti / tot * 100) + '%';
      }
      scrivi(`  ✓ ${k} completata`);
    }
    if (sel.some(k => ['componenti', 'distinta', 'items_bc', 'tdp'].includes(k))) {
      scrivi('Aggiorno materiali ed € dei componenti…'); await api('/api/admin/ricava-componenti', { method: 'POST', body: {} }); scrivi('  ✓ componenti aggiornati');
    }
    $('#im-bar').style.width = '100%';
    scrivi('Importazione completata.');
    toast('Importazione completata', 'ok');
  } catch (e) { scrivi('ERRORE: ' + e.message); toast(e.message, 'err'); go.disabled = false; return; }
  finally { go.disabled = false; }
  // elenchi aggiornati: dopo un'importazione grande il database può essere ancora sotto sforzo, quindi si aspetta un attimo
  await new Promise(r => setTimeout(r, 2000));
  try { await caricaAnagrafiche(); } catch (e) { scrivi(`(Dati importati. Gli elenchi non si sono ancora aggiornati: ricarica la pagina tra qualche secondo.)`); }
  conteggiDb();
}

avvia();
</script>
